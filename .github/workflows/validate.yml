name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Validate skills
        run: bun scripts/validate-skills.mjs
      - name: Test validators
        run: bun test scripts/lib/*.test.mjs
      - name: Verify behavior fixtures
        run: bun scripts/verify-eval-fixtures.mjs
      - name: Install website dependencies
        working-directory: www
        run: bun install --frozen-lockfile
      - name: Check website
        working-directory: www
        run: bun run check
      - name: Build website
        working-directory: www
        run: bun run build
