name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Validate skills
        run: bun scripts/validate-skills.mjs
      - name: Audit packaged skills
        run: bunx @crafter/skillkit@0.13.0 audit skills --json --strict
      - name: Test validators
        run: bun test scripts/lib/*.test.mjs
      - name: Test verify kit freshness
        run: bash skills/.experimental/verify-setup/scripts/test-fresh.sh
      - name: Test correct-derived gates
        run: bash skills/gate/scripts/test-correct-gates.sh
      - name: Test verify kit drift check
        run: bash skills/.experimental/verify-setup/scripts/test-scaffold-check.sh
      - name: Test Gate report contract
        run: bash skills/gate/scripts/test-report-gate.sh
      - name: Test FX review worker
        run: bun test skills/gate/scripts/run-fx-review.test.mjs
      - name: Test Gate executable dependency contract
        run: bash skills/gate/scripts/test-execdeps-gate.sh
      - name: Install website dependencies
        working-directory: www
        run: bun install --frozen-lockfile
      - name: Check website
        working-directory: www
        run: bun run check
      - name: Build website
        working-directory: www
        run: bun run build
