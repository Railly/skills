name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Validate skills
        run: bun scripts/validate-skills.mjs
      - name: Validate Issue Contracts
        run: bun scripts/validate-issue-contracts.mjs
      - name: Audit packaged skills
        run: bunx @crafter/skillkit@0.13.0 audit skills --json --strict
      - name: Test validators
        run: bun test scripts/lib/*.test.mjs
      - name: Test Review Gate report contract
        run: bash skills/review-gate/scripts/test-report-gate.sh
      - name: Test FX review worker
        run: bun test skills/review-gate/scripts/run-fx-review.test.mjs
      - name: Test Review Gate executable dependency contract
        run: bash skills/review-gate/scripts/test-execdeps-gate.sh
      - name: Validate compiled knowledge
        run: bun scripts/validate-knowledge.mjs
      - name: Check compiled knowledge projections
        run: bun scripts/compile-knowledge.mjs --check
      - name: Check textual match audit
        run: bun scripts/audit-knowledge-matches.mjs --check
      - name: Verify behavior fixtures
        run: bun scripts/verify-eval-fixtures.mjs
      - name: Install website dependencies
        working-directory: www
        run: bun install --frozen-lockfile
      - name: Check website
        working-directory: www
        run: bun run check
      - name: Build website
        working-directory: www
        run: bun run build
